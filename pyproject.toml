[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-workflows"
version = "0.0.1"
description = "Repeatable browser workflows into self-healing APIs — M0 feasibility"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "playwright>=1.49,<2", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hydra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires explicit opt-in and real TinyFish credentials"]

